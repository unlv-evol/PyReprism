[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PyReprism"
version = "0.1.0"
authors = [
  { name = "UNLV EVOL LAB", email = "ogenrwot@unlv.nevada.edu" },
]
license = { file = "LICENSE" }
description = "Framework for Source Code Preprocessing"
readme = "docs/intro.rst"
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
accurate = [
  "pygments",
]
dev = [
  "flake8",
  "pytest",
  "pytest-cov",
  "pygments",
  "build",
  "twine",
]
docs = [
  "sphinx",
  "sphinx_rtd_theme",
]

[project.scripts]
pyreprism = "PyReprism.cli:main"

[project.urls]
Homepage = "https://github.com/unlv-evol/PyReprism"
Documentation = "https://pyreprism.readthedocs.io"
Issues = "https://github.com/unlv-evol/PyReprism/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/PyReprism"]

[tool.hatch.build]
exclude = [
  "docs",
  "tests",
  "venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/PyReprism --cov-report=term"

[tool.coverage.run]
source = ["src/PyReprism"]

[tool.coverage.report]
show_missing = true
